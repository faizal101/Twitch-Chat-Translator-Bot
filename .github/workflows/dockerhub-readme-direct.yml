name: Update Docker Hub README

on:
  push:
    paths:
      - 'README.dockerhub.md'
      - '.github/workflows/dockerhub-readme-direct.yml'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          username = os.environ['DOCKERHUB_USERNAME']
          token = os.environ['DOCKERHUB_TOKEN']
          repo = 'twitch-chat-translator-bot'
          readme_path = Path('README.dockerhub.md')

          if not readme_path.exists():
              print('README file not found', file=sys.stderr)
              sys.exit(1)
          if not username or not token:
              print('Docker Hub credentials are not configured', file=sys.stderr)
              sys.exit(1)

          description = readme_path.read_text(encoding='utf-8')
          payload = json.dumps({'full_description': description}).encode('utf-8')

          req = urllib.request.Request(
              f'https://hub.docker.com/v2/repositories/{username}/{repo}/',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': f'Basic {token if False else ""}',
              },
              method='PATCH'
          )

          auth = urllib.request.HTTPBasicAuthHandler()
          opener = urllib.request.build_opener(auth)
          try:
              with opener.open(req) as resp:
                  print(resp.status)
          except urllib.error.HTTPError as e:
              print(e.read().decode('utf-8'), file=sys.stderr)
              sys.exit(1)
          PY
